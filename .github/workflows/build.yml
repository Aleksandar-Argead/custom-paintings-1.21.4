name: Build and Release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Verify JAR
        run: |
          JAR_FILE=$(ls build/libs/*.jar | head -n 1) || { echo "No JAR found in build/libs/"; exit 1; }
          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_ENV

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP 'mod_version=\K.*' gradle.properties || echo "${{ github.sha }}")
          [[ "${{ github.ref }}" =~ ^refs/tags/v(.+)$ ]] && VERSION=${BASH_REMATCH[1]}
          JAR_NAME=$(basename "${{ env.JAR_FILE }}")
          gh release create "v$VERSION" \
            --title "Release v$VERSION" \
            --notes "Automated release for v$VERSION\nCommit: ${{ github.sha }}" \
            --draft=false \
            --prerelease=${{ github.event_name == 'workflow_dispatch' }} \
            "${{ env.JAR_FILE }}#$JAR_NAME" || \
            gh release upload "v$VERSION" "${{ env.JAR_FILE }}#$JAR_NAME" --clobber
          echo "Released v$VERSION with $JAR_NAME"
