# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        # Use these Java versions
        java: [
          21,    # Current Java LTS
        ]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        run: |
          git clone ${{ github.repositoryUrl }} repo
          cd repo
          git checkout ${{ github.sha }}
      - name: Setup JDK ${{ matrix.java }}
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-${{ matrix.java }}-jdk
          java -version
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build
        run: ./gradlew build
      - name: Capture build artifacts
        if: ${{ matrix.java == '21' }} # Only upload artifacts built from latest java
        run: |
          echo "Artifact upload step is commented out due to restrictions on using external actions."
          # This step would normally use actions/upload-artifact@v4, but it's not allowed.
          # Artifacts are available in build/libs/ after the build.
