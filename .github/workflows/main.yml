name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensure full history for version tagging

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin' # Use Eclipse Temurin for consistency

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Verify JAR exists
        run: |
          if [ ! -f build/libs/*.jar ]; then
            echo "No JAR file found in build/libs/"
            exit 1
          fi

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extract version from gradle.properties or use commit SHA
          VERSION=$(grep -oP 'version=\K.*' gradle.properties 2>/dev/null || echo "${{ github.sha }}")
          # If triggered by a tag, use the tag name
          if [[ "${{ github.ref }}" =~ ^refs/tags/v(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          fi
          # Find the JAR file (assuming one JAR per build)
          JAR_FILE=$(ls build/libs/*.jar | head -n 1)
          JAR_NAME=$(basename "$JAR_FILE")
          # Create release title and notes
          TITLE="Release v$VERSION"
          NOTES="Automated release for version $VERSION\n\nBuilt from commit ${{ github.sha }}"
          # Create or update the release
          gh release create "v$VERSION" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --draft=false \
            --prerelease=false \
            "$JAR_FILE#$JAR_NAME" || {
              echo "Release creation failed, checking if it exists..."
              gh release upload "v$VERSION" "$JAR_FILE#$JAR_NAME" --clobber
            }
          echo "Release created or updated: v$VERSION with $JAR_NAME"
